name: jet_cad_screenshots
description: >-
  The published packages' screenshots (package READMEs spec D4): five
  scenes over the packages' public widgets, written into each package's
  doc/screenshots/ with UPDATE_SCREENSHOTS=1. Not a product package.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: ">=3.44.0"

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  jet_cad_2d: ^0.7.3
  jet_cad_2d_flutter: ^0.7.4
  jet_cad_2d_plan: ^1.0.0
  jet_cad_2d_kit: ^0.1.1
  jet_cad_2d_kit_architecture: ^0.1.2
  jet_cad_2d_kit_restaurant: ^0.1.1
  # The Salon sample, the one source the demo and the restaurant kit's
  # pictures share (4b P5): `package:restaurant_demo/samples/salon.dart`.
  restaurant_demo: ^0.0.1
  vector_math: ^2.2.0

flutter:
  uses-material-design: true
  # As a host declares it (host guide §2): the plan library's bytes under
  # the bare family the plans name.
  fonts:
    - family: Roboto
      fonts:
        - asset: packages/jet_cad_2d_plan/fonts/Roboto-Regular.ttf
