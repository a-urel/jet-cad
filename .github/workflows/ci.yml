# Spec 14d P4-P7: every gate on every push and pull request. Nothing here
# writes: no commit, no push, no diff of the analysis_options.yaml files
# `pub get` rewrites (CLAUDE.md). Known failures and skips are compared
# exactly against tool/ci/standing_failures.txt and standing_skips.txt,
# never skipped.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a branch cancels its older run; on main every commit
# keeps its verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: 'true'
  # The version every gate of 14d ran on.
  FLUTTER_VERSION: '3.47.6'

jobs:
  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/jet_cad_2d
            tool: dart
          - package: packages/jet_cad_2d_flutter
            tool: flutter
          - package: packages/jet_cad_2d_gpu
            tool: flutter
          - package: packages/jet_cad_2d_kit
            tool: flutter
          - package: packages/jet_cad_2d_plan
            tool: flutter
            # The pick's and the band's allocation tests (2b Task 14) read
            # the VM's allocation profiler.
            test_flags: --enable-vmservice
          - package: packages/jet_cad_2d_kit_architecture
            tool: flutter
          - package: packages/jet_cad_2d_kit_restaurant
            tool: flutter
          - package: packages/jet_cad_2d_integration
            tool: flutter
            # The paint-allocation invariant over the sample flat (spec 3a
            # C6) reads the VM's allocation profiler, as the plan
            # library's does.
            test_flags: --enable-vmservice
          - package: apps/architecture_demo
            tool: flutter
          - package: apps/restaurant_demo
            tool: flutter
          - package: tool/screenshots
            tool: flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Tests
        working-directory: ${{ matrix.package }}
        # The runner's own exit code is not the verdict: the next step is.
        run: ${{ matrix.tool }} test ${{ matrix.test_flags }} --file-reporter "json:$RUNNER_TEMP/tests.json" || true
      - name: Failures and skips against the standing lists
        run: >-
          dart run tool/ci/expect_failures.dart
          --package ${{ matrix.package }}
          --root ${{ matrix.package }}
          "$RUNNER_TEMP/tests.json"
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.tool == 'dart' && 'dart analyze --fatal-infos' || 'flutter analyze' }}
      - name: Format
        working-directory: ${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed .

  web:
    name: web builds, dev_harness_2d
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      # GPU split spec S8 (F-9, V-7): build hooks follow the built app's own
      # dependencies, so the app ships none of flutter_scene's assets.
      - name: Build the restaurant demo
        working-directory: apps/restaurant_demo
        run: |
          flutter build web
          test ! -e build/web/assets/packages/flutter_scene
      - name: Analyze dev_harness_2d
        working-directory: apps/dev_harness_2d
        run: flutter analyze

  ci-tools:
    name: CI tools, the host guide
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Tests
        working-directory: tool/ci
        run: dart test
      - name: Analyze
        working-directory: tool/ci
        run: >-
          dart analyze --fatal-infos lib test expect_failures.dart
          check_guide.dart check_host_lock.dart package_root.dart
          check_screenshots.dart check_readmes.dart check_kit_deps.dart
          check_api_boundary.dart
      - name: Format
        working-directory: tool/ci
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test expect_failures.dart check_guide.dart check_host_lock.dart package_root.dart
          check_screenshots.dart check_readmes.dart check_kit_deps.dart
          check_api_boundary.dart
          ../readme_probe/lib
      # The probe is a host of its own (pubspec.yaml.in, sdk ^3.6.0); in the
      # repository it sits inside tool/ci, so its language version is named.
      - name: Format the host probe at its own language version
        working-directory: tool/ci
        run: >-
          dart format --language-version=3.6 --output=none --set-exit-if-changed
          host_probe/lib
      - name: The host guide's code is the probe's
        run: dart run tool/ci/check_guide.dart
      - name: No shadcn_ui type is in the plan library's API
        run: dart run tool/ci/check_api_boundary.dart
      - name: The screenshots hold pub.dev's rules
        run: dart run tool/ci/check_screenshots.dart
      - name: The package READMEs' code is the probe's
        run: dart run tool/ci/check_readmes.dart
      - name: No kit names the plan library or another kit
        run: dart run tool/ci/check_kit_deps.dart
      - name: Analyze the README probe
        working-directory: tool/readme_probe
        run: flutter analyze

  publishable:
    name: ${{ matrix.package }}, publishable to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/jet_cad_2d
          - packages/jet_cad_2d_flutter
          - packages/jet_cad_2d_kit
          - packages/jet_cad_2d_plan
          - packages/jet_cad_2d_kit_architecture
          - packages/jet_cad_2d_kit_restaurant
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      # Decision 2 of the publishing spec: each published package carries
      # the root's Apache 2.0 licence, byte for byte.
      - name: The licence is the root's
        run: cmp LICENSE ${{ matrix.package }}/LICENSE
      # A dry run uploads nothing; it exits 65 on any warning (a version
      # bump without its CHANGELOG entry, a modified checked-in file), not
      # only on an error. A dependent's dry run does not need its
      # dependency on pub.dev (spec F-2).
      - name: Publish dry run
        working-directory: ${{ matrix.package }}
        run: dart pub publish --dry-run

  host-probe:
    name: a host from pub.dev, repo packages overridden
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The repository checked out here, at the commit under test (merge
      # commits included): no token, whatever the repository's visibility.
      # GPU split spec S8: its lock and its web build hold no GPU renderer
      # and no build hook.
      - name: Resolve, check, analyze and build the probe
        run: tool/ci/host_probe.sh "file://$GITHUB_WORKSPACE" "$(git rev-parse HEAD)"
