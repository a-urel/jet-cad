name: dev_harness_2d
description: >-
  Measurement harness for the jet_cad_2d render path. Not a product: it exists
  so R2, R4a and R4b run on a real device in profile mode, where frame timings
  mean something.
publish_to: none
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  jet_cad_2d:
    path: ../../packages/jet_cad_2d
  jet_cad_2d_flutter:
    path: ../../packages/jet_cad_2d_flutter
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  uses-material-design: true
