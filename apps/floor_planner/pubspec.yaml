name: floor_planner
description: >-
  The floor planner product application. Hosts a DraftCanvas behind a
  CameraGestureDetector, with empty chrome slots that later sub-projects
  fill. Not an instrument: the measurement harness is apps/dev_harness_2d.
publish_to: none
version: 0.0.1
resolution: workspace

environment:
  # file_selector_web needs Flutter 3.38 (Dart 3.10); the flutter bound says
  # so. The sdk bound stays at ^3.5.0 because it sets the language version:
  # from 3.7 on the formatter switches to the tall style and the analyzer adds
  # lints, which would rewrite nearly every file in the app.
  sdk: ^3.5.0
  flutter: ">=3.38.0"

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  jet_cad_2d:
    path: ../../packages/jet_cad_2d
  jet_cad_2d_flutter:
    path: ../../packages/jet_cad_2d_flutter
  meta: ^1.18.0
  vector_math: ^2.2.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/library/furniture.jetlib
