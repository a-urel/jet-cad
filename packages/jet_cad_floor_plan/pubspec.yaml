name: jet_cad_floor_plan
description: >-
  An embeddable parametric floor planner for Flutter: walls, openings,
  rooms, dimensions and furniture symbols, with a host API for tables.
version: 0.7.2
repository: https://github.com/a-urel/jet-cad
issue_tracker: https://github.com/a-urel/jet-cad/issues
funding:
  - https://github.com/sponsors/a-urel
  - https://buymeacoffee.com/yazemo
screenshots:
  - description: 'FloorPlanView in design mode: tools, symbols, layers and the page, light theme.'
    path: doc/screenshots/design_light.png
  - description: 'Table statuses with captions and a group of tables in the service view.'
    path: doc/screenshots/service_status.png
  - description: 'The editor in a dark theme.'
    path: doc/screenshots/design_dark.png
  - description: 'The service view in a dark POS theme, one zone of tables in focus.'
    path: doc/screenshots/service_dark_focus.png
  - description: 'Rubber-band selection of tables (floorDrag: band).'
    path: doc/screenshots/service_band.png
  - description: 'Tables in plan colours.'
    path: doc/screenshots/service_colors.png
topics:
  - cad
  - floor-plan
  - restaurant
  - point-of-sale
resolution: workspace

environment:
  # The floor pub workspaces document for their members; it sets language
  # 3.6, which formats and analyses as 3.5 did. pdf 3.13.x, which the
  # PDF export and printing need, requires Dart >= 3.12.0, which Flutter
  # first ships in 3.44.0: that bound binds.
  sdk: ^3.6.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Spec 14d L2: Flutter's Material, Widgets and Cupertino words for de and
  # tr, listed with the planner's own delegate.
  flutter_localizations:
    sdk: flutter
  jet_cad_2d: ^0.7.2
  jet_cad_2d_flutter: ^0.7.2
  meta: ^1.18.0
  pdf: ^3.13.1
  printing: ^5.15.1
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  vm_service: ^15.2.0

flutter:
  assets:
    - assets/library/furniture.jetlib
    - lib/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto_LICENSE.txt
