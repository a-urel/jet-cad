name: jet_cad_2d
description: >-
  A pure-Dart 2D CAD engine and document model: a scene tree, columnar
  geometry, a spatial index with picking and snapping, undoable commands and a
  deterministic file format.
version: 0.7.2
repository: https://github.com/a-urel/jet-cad
issue_tracker: https://github.com/a-urel/jet-cad/issues
topics:
  - cad
  - geometry
  - spatial-index
  - drawing
resolution: workspace

environment:
  sdk: ^3.6.0
dependencies:
  meta: ^1.18.0
  vector_math: ^2.2.0
dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
  vm_service: ^15.2.0
