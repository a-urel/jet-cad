name: jet_cad_2d_flutter
description: >-
  Flutter rendering and interaction for the jet_cad_2d engine: a CAD canvas
  with camera, rulers, selection and snapping, and PDF and PNG export.
version: 0.7.2
repository: https://github.com/a-urel/jet-cad
issue_tracker: https://github.com/a-urel/jet-cad/issues
funding:
  - https://github.com/sponsors/a-urel
  - https://buymeacoffee.com/yazemo
screenshots:
  - description: 'A drawing on its sheet, with rulers, drawn by DraftCanvas on a light canvas.'
    path: doc/screenshots/canvas_light.png
  - description: 'The same drawing on the dark canvas, its colours re-toned for a dark theme.'
    path: doc/screenshots/canvas_dark.png
  - description: 'A selection with its grips, and an entity under the mouse highlighted.'
    path: doc/screenshots/selection_grips.png
  - description: 'A crossing selection band, dragged right to left.'
    path: doc/screenshots/selection_band.png
  - description: 'SymbolGallery: a furniture library in collapsible categories of thumbnails.'
    path: doc/screenshots/symbol_gallery.png
topics:
  - cad
  - drawing
  - canvas
  - pdf
resolution: workspace

environment:
  # The floor pub workspaces document for their members; it sets language
  # 3.6, which formats and analyses as 3.5 did. pdf 3.13.x requires Dart
  # >= 3.12.0, which Flutter first ships in 3.44.0: that bound binds.
  sdk: ^3.6.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  jet_cad_2d: ^0.7.2
  meta: ^1.18.0
  vector_math: ^2.2.0
  # The vector PDF export's writer (spec 13 D3). Pure Dart, Apache 2.0.
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
