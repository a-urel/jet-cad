name: jet_cad_2d_flutter
description: >-
  Flutter rendering layer for the pure-Dart jet_cad_2d engine. Owns the camera,
  coordinate rebasing, the paint seam and the viewport widget. The engine
  package stays free of dart:ui.
version: 0.4.0
repository: https://github.com/ahmeturel/jet-cad
publish_to: none
resolution: workspace

environment:
  sdk: ^3.5.0
  # pdf 3.13.x requires Dart >= 3.12.0, which Flutter first ships in 3.44.0.
  # Only this bound moves; `sdk:` sets the language version (spec 13 R-4).
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  jet_cad_2d:
    path: ../jet_cad_2d
  meta: ^1.18.0
  vector_math: ^2.2.0
  # The vector PDF export's writer (spec 13 D3). Pure Dart, Apache 2.0.
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
