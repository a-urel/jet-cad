name: jet_cad_2d_plan
description: >-
  The plan library for jet_cad_2d: a plan controller and composable
  design-mode widgets over kits that contribute types, tools and symbols.
version: 0.8.0
repository: https://github.com/a-urel/jet-cad
issue_tracker: https://github.com/a-urel/jet-cad/issues
funding:
  - https://github.com/sponsors/a-urel
  - https://buymeacoffee.com/yazemo
screenshots:
  - description: 'The plan editor over the architecture kit''s sample flat: walls, rooms, doors, windows and furniture.'
    path: doc/screenshots/plan_editor.png
  - description: 'PlanSymbolGallery, the plan library''s symbol library, over the architecture kit''s furniture.'
    path: doc/screenshots/plan_gallery.png
topics:
  - cad
  - floor-plan
  - editor
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  jet_cad_2d: ^0.7.3
  jet_cad_2d_flutter: ^0.7.3
  jet_cad_2d_kit: ^0.1.0
  meta: ^1.18.0
  pdf: ^3.13.1
  printing: ^5.15.1
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  vm_service: ^15.2.0

flutter:
  assets:
    - lib/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto_LICENSE.txt
