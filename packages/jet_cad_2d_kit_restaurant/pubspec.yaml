name: jet_cad_2d_kit_restaurant
description: >-
  The restaurant kit for jet_cad_2d plans: a library of 69 restaurant symbols
  (tables, booths, bar, service, commercial kitchen, outdoor and decor), the
  servable ones as service units.
version: 0.1.1
repository: https://github.com/a-urel/jet-cad
issue_tracker: https://github.com/a-urel/jet-cad/issues
funding:
  - https://github.com/sponsors/a-urel
  - https://buymeacoffee.com/yazemo
screenshots:
  - description: 'The demo''s Salon in the plan library''s editor: the kit''s tables, booths, bar and host stand.'
    path: doc/screenshots/restaurant_salon.png
  - description: 'PlanSymbolGallery over the kit''s symbols, its sections listed and one of them open.'
    path: doc/screenshots/restaurant_gallery.png
topics:
  - cad
  - floor-plan
  - restaurant
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  jet_cad_2d: ^0.7.3
  jet_cad_2d_kit: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  vector_math: ^2.2.0

flutter:
  assets:
    - assets/library/restaurant.jetlib
